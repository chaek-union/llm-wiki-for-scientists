<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 470" width="660" height="470" role="img" aria-label="챗봇은 사람이 대화창에 넣으면 답변이 나오고 대화 기록만 남는다. 에이전트는 목표를 받아 폴더의 파일을 읽고 만들고 고치고 도구를 실행하고 승인을 요청하며 폴더 안의 파일과 작업 기록이 남는다">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4a5568"/>
    </marker>
    <style>
      .box   { fill: #f4f6f8; stroke: #4a5568; stroke-width: 1.5; }
      .out   { fill: #eef1f4; stroke: #4a5568; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .lbl   { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
               font-size: 15px; fill: #1a202c; text-anchor: middle; }
      .head  { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
               font-size: 16px; font-weight: 700; fill: #1a202c; }
      .note  { font-family: 'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
               font-size: 13px; fill: #4a5568; }
      .edge  { stroke: #4a5568; stroke-width: 1.5; fill: none; marker-end: url(#a); }
      .line  { stroke: #4a5568; stroke-width: 1.5; fill: none; }
      .rule  { stroke: #cbd2d9; stroke-width: 1; }
    </style>
  </defs>

  <text class="head" x="30" y="26">챗봇</text>
  <rect class="box" x="30"  y="44" width="76" height="44" rx="7"/>
  <rect class="box" x="144" y="44" width="90" height="44" rx="7"/>
  <rect class="box" x="272" y="44" width="76" height="44" rx="7"/>
  <text class="lbl" x="68"  y="72">사람</text>
  <text class="lbl" x="189" y="72">대화창</text>
  <text class="lbl" x="310" y="72">답변</text>
  <path class="edge" d="M 106 66 L 138 66"/>
  <path class="edge" d="M 234 66 L 266 66"/>
  <text class="note" x="30" y="116">남는 것 — 대화 기록</text>

  <line class="rule" x1="30" y1="140" x2="630" y2="140"/>

  <text class="head" x="30" y="176">에이전트</text>
  <rect class="box" x="30"  y="278" width="76"  height="44" rx="7"/>
  <rect class="box" x="144" y="278" width="76"  height="44" rx="7"/>
  <rect class="box" x="258" y="278" width="100" height="44" rx="7"/>
  <text class="lbl" x="68"  y="306">사람</text>
  <text class="lbl" x="182" y="306">목표</text>
  <text class="lbl" x="308" y="306">에이전트</text>
  <path class="edge" d="M 106 300 L 138 300"/>
  <path class="edge" d="M 220 300 L 252 300"/>

  <path class="line" d="M 358 300 L 396 300"/>
  <path class="line" d="M 396 216 L 396 384"/>

  <rect class="box" x="420" y="194" width="200" height="44" rx="7"/>
  <rect class="box" x="420" y="250" width="200" height="44" rx="7"/>
  <rect class="box" x="420" y="306" width="200" height="44" rx="7"/>
  <rect class="box" x="420" y="362" width="200" height="44" rx="7"/>
  <text class="lbl" x="520" y="222">폴더의 파일 읽기</text>
  <text class="lbl" x="520" y="278">파일 만들기와 고치기</text>
  <text class="lbl" x="520" y="334">도구 실행과 검사</text>
  <text class="lbl" x="520" y="390">사람의 승인 요청</text>
  <path class="edge" d="M 396 216 L 414 216"/>
  <path class="edge" d="M 396 272 L 414 272"/>
  <path class="edge" d="M 396 328 L 414 328"/>
  <path class="edge" d="M 396 384 L 414 384"/>

  <text class="note" x="30" y="434">남는 것 — 폴더 안의 파일과 작업 기록</text>
</svg>
